# Candy behind Nginx. Install at /etc/nginx/sites-available/candy and link it
# into sites-enabled.
#
# Nginx terminates TLS and Candy binds loopback, so `CANDY_PUBLIC_ORIGIN` is
# the name served here and nothing else. Candy checks the `Host` header of
# every request against it and the `Origin` header of every write, so the two
# proxy_set_header lines below are not cosmetic: dropping them makes every
# authenticated write answer 403.

server {
    listen 80;
    listen [::]:80;
    server_name candy.example.com;

    # ACME lives on 80; everything else is redirected, so no browser ever sends
    # a session cookie in the clear.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name candy.example.com;

    ssl_certificate     /etc/letsencrypt/live/candy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:candy_tls:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The session cookies Candy sets carry the `__Host-` prefix, which browsers
    # honour only over HTTPS. HSTS is what keeps a first request from being the
    # one that leaks one.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # A provider response can be large and an upload can be a whole file; the
    # account API's own body caps are much smaller and enforced by Candy.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Candy pins every route to CANDY_PUBLIC_ORIGIN. Passing the client's
        # Host through is what makes the deployment's own name reach it; the
        # default would send `127.0.0.1:8787` and every route would refuse.
        proxy_set_header Host $host;
        # Writes additionally require an exact Origin match.
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The browser holds a Server-Sent Events stream for the whole session
        # and a WebSocket for the Remote gateway. Both die on a proxy that
        # buffers or times them out.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# `Connection: upgrade` only when the client asked for it; a bare `upgrade`
# breaks ordinary keep-alive requests. Belongs in the http block.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
